name: CI
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: find software/php -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: for f in software/php/*.js software/php/settings/*.js; do node --check "$f"; done
